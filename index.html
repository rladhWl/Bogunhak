<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보건학 암기앱 확장판</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
    }
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #e5e7eb; color: #111827; }
    .good { background: #16a34a; color: #fff; }
    .warn { background: #f59e0b; color: #fff; }
    .danger { background: #dc2626; color: #fff; }
    .purple { background: #7c3aed; color: #fff; }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .question {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.6;
      margin: 14px 0;
    }
    .desc {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .choices {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }
    .choice {
      width: 100%;
      text-align: left;
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .choice.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }
    .choice.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }
    .answer {
      display: none;
      white-space: pre-line;
      line-height: 1.75;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 12px;
    }
    .stat {
      background: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .stat .num {
      font-size: 28px;
      font-weight: 800;
      color: #2563eb;
    }
    .exam-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      line-height: 1.7;
    }
    .wrong-note {
      margin-top: 12px;
      padding: 14px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 12px;
      white-space: pre-line;
      line-height: 1.7;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 800;
    }
    @media (max-width: 840px) {
      .grid, .stats { grid-template-columns: 1fr 1fr; }
      .question { font-size: 19px; }
    }
    @media (max-width: 520px) {
      .grid, .stats { grid-template-columns: 1fr; }
      .btns { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>보건학 암기앱 확장판</h1>
    <div class="subtitle">
      보건학 주요 범위: 건강 개념, 질병과 예방, 공중보건학, 보건행정, 보건소, 보건복지부, 사회보장, 건강보험, WHO 등
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="mode">학습 모드</label>
          <select id="mode">
            <option value="short">서술형</option>
            <option value="mcq">객관식 4지선다</option>
            <option value="ox">OX</option>
          </select>
        </div>
        <div>
          <label for="part">파트</label>
          <select id="part">
            <option value="all">전체</option>
            <option value="건강개념">건강개념</option>
            <option value="질병과 예방">질병과 예방</option>
            <option value="공중보건학">공중보건학</option>
            <option value="보건행정">보건행정</option>
            <option value="보건소와 조직">보건소와 조직</option>
            <option value="사회보장과 건강보험">사회보장과 건강보험</option>
            <option value="국제보건">국제보건</option>
          </select>
        </div>
        <div>
          <label for="filter">필터</label>
          <select id="filter">
            <option value="all">전체 문제</option>
            <option value="hard">어려움 표시 문제만</option>
            <option value="unseen">아직 안 본 문제만</option>
          </select>
        </div>
        <div>
          <label for="search">검색</label>
          <input id="search" type="text" placeholder="예: 보건소, POSDCORB, 건강보험" />
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="newBtn">새 문제</button>
        <button class="secondary" id="showAnswerBtn">정답 보기</button>
        <button class="good" id="knownBtn">외웠음</button>
        <button class="warn" id="hardBtn">어려움</button>
        <button class="purple" id="startExamBtn">20문제 모의고사 시작</button>
        <button class="secondary" id="wrongNoteBtn">오답노트 보기</button>
        <button class="danger" id="resetBtn">기록 초기화</button>
      </div>

      <div class="exam-box" id="examBox">
        <div><strong>모의고사 모드</strong></div>
        <div id="examStatus">모의고사 준비 중...</div>
        <div class="btns" style="margin-top:10px;">
          <button class="primary" id="nextExamBtn">다음 문제</button>
          <button class="secondary" id="finishExamBtn">모의고사 종료</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="badges">
        <span class="badge" id="badgePart">파트</span>
        <span class="badge" id="badgeMode">모드</span>
        <span class="badge" id="badgeCount">문제 수</span>
      </div>
      <div class="desc" id="metaText">문제를 불러오는 중...</div>
      <div class="question" id="questionBox">문제가 여기에 표시됩니다.</div>
      <div class="choices" id="choicesBox"></div>
      <div class="answer" id="answerBox"></div>
      <div id="wrongNoteArea"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="num" id="totalStat">0</div>
        <div>전체 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="seenStat">0</div>
        <div>학습한 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="hardStat">0</div>
        <div>어려운 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="knownStat">0</div>
        <div>외운 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="accStat">0%</div>
        <div>객관식/OX 정답률</div>
      </div>
    </div>
  </div>

  <script>
    const items = [
      // 건강개념
      {id:1, part:"건강개념", question:"건강의 정의를 설명하시오.", answer:"건강이란 단순히 질병이나 허약이 없는 상태가 아니라 신체적, 정신적, 사회적으로 완전한 안녕 상태를 의미한다."},
      {id:2, part:"건강개념", question:"WHO의 건강 정의를 설명하시오.", answer:"WHO는 건강을 단순히 질병이나 허약이 없는 상태가 아니라 신체적, 정신적, 사회적으로 완전한 안녕 상태라고 정의하였다."},
      {id:3, part:"건강개념", question:"사회적 건강의 의미를 설명하시오.", answer:"사회적 건강이란 개인이 사회 속에서 원만한 인간관계를 유지하고 사회적 역할과 책임을 효과적으로 수행하며 사회생활에 잘 적응하는 상태를 의미한다."},
      {id:4, part:"건강개념", question:"Claude Bernard의 건강관을 설명하시오.", answer:"Claude Bernard는 건강을 외부환경의 변화에도 내부환경의 항상성이 유지되는 상태로 보았다."},
      {id:5, part:"건강개념", question:"Wylie의 건강관을 설명하시오.", answer:"Wylie는 건강을 유기체가 외부환경의 조건에 부단히 잘 적응해 나가는 상태로 설명하였다."},
      {id:6, part:"건강개념", question:"Parson의 건강관을 설명하시오.", answer:"Parson은 건강을 각 개인이 사회적 역할과 임무를 효과적으로 수행할 수 있는 최적의 상태로 보았다."},
      {id:7, part:"건강개념", question:"건강개념 변천의 4가지 모형을 쓰시오.", answer:"생태학적 모형, 사회생태학적 모형, WHO 모형, 전인적 모형이다."},
      {id:8, part:"건강개념", question:"생태학적 모형을 설명하시오.", answer:"생태학적 모형은 건강이 인간, 환경, 병원체 간의 균형에 의해 결정된다고 보는 모형이다."},
      {id:9, part:"건강개념", question:"사회생태학적 모형을 설명하시오.", answer:"사회생태학적 모형은 인간요소와 외부 환경요소의 상호작용을 강조하며 사회적 환경의 영향을 포함하는 모형이다."},
      {id:10, part:"건강개념", question:"WHO 모형을 설명하시오.", answer:"WHO 모형은 건강을 신체적, 정신적, 사회적으로 완전한 안녕 상태로 보는 모형이다."},
      {id:11, part:"건강개념", question:"전인적 모형을 설명하시오.", answer:"전인적 모형은 유전, 환경, 생활양식, 보건의료서비스 등을 종합적으로 고려하여 건강을 이해하는 모형이다."},
      {id:12, part:"건강개념", question:"건강개념이 소극적 개념에서 적극적 개념으로 변화한 의미를 설명하시오.", answer:"건강개념은 단순히 질병이 없는 상태에서 벗어나 환경 적응, 사회적 역할 수행, 삶의 질 향상까지 포함하는 적극적 개념으로 발전하였다."},
      {id:13, part:"건강개념", question:"건강결정요인을 설명하시오.", answer:"건강은 생물학적 요인, 유전, 생활양식, 사회경제적 환경, 문화, 정치, 보건의료체계 등 다양한 요인에 의해 결정된다."},
      {id:14, part:"건강개념", question:"환경요인이 건강에 미치는 영향을 설명하시오.", answer:"환경요인은 물리적, 화학적, 생물학적 조건을 통해 질병 발생과 건강상태에 직접 또는 간접적으로 영향을 준다."},
      {id:15, part:"건강개념", question:"건강증진의 의미를 설명하시오.", answer:"건강증진은 개인과 지역사회가 스스로 건강을 통제하고 향상시킬 수 있도록 역량을 강화하는 과정이다."},

      // 질병과 예방
      {id:16, part:"질병과 예방", question:"질병의 개념을 설명하시오.", answer:"질병은 신체적, 정신적, 사회적 기능에 이상이 발생하여 정상적인 상태를 벗어난 것을 의미한다."},
      {id:17, part:"질병과 예방", question:"질병 발생의 3요소를 설명하시오.", answer:"질병 발생의 3요소는 숙주, 환경, 병인이다."},
      {id:18, part:"질병과 예방", question:"숙주 요인을 설명하시오.", answer:"숙주 요인은 연령, 성별, 유전, 면역상태, 생활습관 등 질병 발생에 영향을 주는 개인적 특성이다."},
      {id:19, part:"질병과 예방", question:"환경 요인을 설명하시오.", answer:"환경 요인은 물리적, 화학적, 생물학적, 사회적 환경으로서 질병 발생과 건강상태에 영향을 준다."},
      {id:20, part:"질병과 예방", question:"병인 요인을 설명하시오.", answer:"병인 요인은 세균, 바이러스, 화학물질, 물리적 자극 등 질병을 직접 일으키는 원인이다."},
      {id:21, part:"질병과 예방", question:"결함의 개념을 설명하시오.", answer:"결함은 심리적, 생리적, 해부학적 구조나 기능의 상실 또는 이상을 의미한다."},
      {id:22, part:"질병과 예방", question:"장애의 개념을 설명하시오.", answer:"장애는 결함으로 인해 정상적인 활동을 수행하는 능력이 제한되거나 결여된 상태를 의미한다."},
      {id:23, part:"질병과 예방", question:"불구의 개념을 설명하시오.", answer:"불구는 결함이나 장애로 인해 사회적 역할 수행에 제한을 받는 사회적 불이익 상태를 의미한다."},
      {id:24, part:"질병과 예방", question:"결함, 장애, 불구를 비교하여 설명하시오.", answer:"결함은 기능이나 구조의 손상이고, 장애는 활동능력의 제한이며, 불구는 사회적 역할 수행의 제한이다."},
      {id:25, part:"질병과 예방", question:"질병의 자연사를 설명하시오.", answer:"질병의 자연사는 질병 발생 이전 단계부터 질병의 진행, 회복 또는 사망에 이르기까지의 전 과정을 의미한다."},
      {id:26, part:"질병과 예방", question:"질병의 자연사를 예방적 관점에서 설명하시오.", answer:"질병의 자연사는 질병발생 전부터 회복 또는 사망에 이르기까지의 과정이며, 이에 따라 1차 예방, 2차 예방, 3차 예방이 적용된다."},
      {id:27, part:"질병과 예방", question:"질병예방의 3단계를 설명하시오.", answer:"1차 예방은 질병발생 이전의 건강증진과 특수예방, 2차 예방은 조기발견과 조기치료, 3차 예방은 재활과 후유증 최소화를 의미한다."},
      {id:28, part:"질병과 예방", question:"1차 예방을 설명하시오.", answer:"1차 예방은 질병발생 이전 단계에서 건강증진과 특수예방을 통해 질병발생 자체를 막는 것이다."},
      {id:29, part:"질병과 예방", question:"2차 예방을 설명하시오.", answer:"2차 예방은 질병을 조기에 발견하고 조기에 치료하여 질병의 진행을 막고 예후를 좋게 하는 것이다."},
      {id:30, part:"질병과 예방", question:"3차 예방을 설명하시오.", answer:"3차 예방은 질병으로 인한 후유증과 장애를 최소화하고 재활과 사회복귀를 돕는 것이다."},
      {id:31, part:"질병과 예방", question:"건강증진과 특수예방을 설명하시오.", answer:"건강증진은 영양개선, 생활환경 개선, 보건교육 등을 통해 건강수준을 높이는 것이고, 특수예방은 예방접종 등 특정 질병을 막기 위한 조치이다."},

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
