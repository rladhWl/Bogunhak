<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보건학 암기앱 안정판</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: #6b7280; line-height: 1.6; margin-bottom: 18px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      min-height: 150px;
      line-height: 1.7;
      resize: vertical;
    }
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e5e7eb; color: #111827; }
    .good { background: #16a34a; color: white; }
    .warn { background: #f59e0b; color: white; }
    .danger { background: #dc2626; color: white; }
    .purple { background: #7c3aed; color: white; }
    .teal { background: #0f766e; color: white; }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .q {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.7;
      margin: 12px 0 16px;
    }
    .choices {
      display: grid;
      gap: 10px;
      margin: 12px 0;
    }
    .choice {
      width: 100%;
      text-align: left;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      color: #111827;
    }
    .choice.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }
    .choice.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }
    .answer, .compare, .wrong-note, .exam-box {
      display: none;
      white-space: pre-line;
      line-height: 1.75;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .answer {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }
    .compare {
      background: #eff6ff;
      border: 1px solid #93c5fd;
    }
    .wrong-note {
      background: #fff7ed;
      border: 1px solid #fdba74;
    }
    .exam-box {
      background: #f8fafc;
      border: 1px solid #dbeafe;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 12px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .stat .num {
      font-size: 26px;
      font-weight: 800;
      color: #2563eb;
    }
    .small { font-size: 13px; color: #6b7280; }
    #shortArea { display: none; margin-top: 14px; }
    #examControlBtns { display: none; }
    @media (max-width: 900px) {
      .grid, .stats { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .grid, .stats { grid-template-columns: 1fr; }
      .btns { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>보건학 암기앱 안정판</h1>
    <div class="sub">
      범위: 1강 건강·질병·공중보건학, 11강 보건행정, 12강 사회보장 및 건강보험, 보건복지부 조직도 레포트
    </div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="mode">학습 모드</label>
          <select id="mode">
            <option value="short">서술형</option>
            <option value="mcq">객관식 4지선다</option>
            <option value="ox">OX</option>
          </select>
        </div>
        <div>
          <label for="part">파트</label>
          <select id="part">
            <option value="all">전체</option>
            <option value="건강개념">건강개념</option>
            <option value="질병과 예방">질병과 예방</option>
            <option value="공중보건학">공중보건학</option>
            <option value="보건행정">보건행정</option>
            <option value="보건소와 조직">보건소와 조직</option>
            <option value="사회보장과 건강보험">사회보장과 건강보험</option>
            <option value="국제보건">국제보건</option>
          </select>
        </div>
        <div>
          <label for="filter">필터</label>
          <select id="filter">
            <option value="all">전체 문제</option>
            <option value="hard">어려움만</option>
            <option value="unseen">안 본 문제만</option>
          </select>
        </div>
        <div>
          <label for="search">검색</label>
          <input id="search" type="text" placeholder="예: 보건소, POSDCORB">
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="newBtn">새 문제</button>
        <button class="secondary" id="showBtn">정답 보기</button>
        <button class="good" id="knownBtn">외웠음</button>
        <button class="warn" id="hardBtn">어려움</button>
        <button class="purple" id="mcqExamBtn">객관식 20문제 시험</button>
        <button class="teal" id="shortExamBtn">서술형 10문제 시험</button>
        <button class="secondary" id="wrongBtn">오답노트</button>
        <button class="danger" id="resetBtn">초기화</button>
      </div>

      <div class="exam-box" id="examBox"></div>

      <div class="btns" id="examControlBtns">
        <button class="primary" id="nextExamBtn">다음 문제</button>
        <button class="secondary" id="finishExamBtn">시험 종료</button>
      </div>
    </div>

    <div class="card">
      <div class="badges">
        <span class="badge" id="badgePart">파트</span>
        <span class="badge" id="badgeMode">모드</span>
        <span class="badge" id="badgeCount">문제 수</span>
      </div>

      <div class="small" id="metaText">문제를 불러오는 중...</div>
      <div class="q" id="questionBox">문제가 여기에 표시됩니다.</div>
      <div class="choices" id="choicesBox"></div>

      <div id="shortArea">
        <label for="userAnswer">내 답안 작성</label>
        <textarea id="userAnswer" placeholder="여기에 직접 서술형 답을 써봐"></textarea>
        <div class="btns">
          <button class="secondary" id="saveShortBtn">내 답 저장</button>
          <button class="primary" id="compareBtn">모범답안과 비교</button>
        </div>
      </div>

      <div class="compare" id="compareBox"></div>
      <div class="answer" id="answerBox"></div>
      <div class="wrong-note" id="wrongBox"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="totalStat">0</div><div>전체 문제</div></div>
      <div class="stat"><div class="num" id="seenStat">0</div><div>학습한 문제</div></div>
      <div class="stat"><div class="num" id="hardStat">0</div><div>어려운 문제</div></div>
      <div class="stat"><div class="num" id="knownStat">0</div><div>외운 문제</div></div>
      <div class="stat"><div class="num" id="accStat">0%</div><div>객관식/OX 정답률</div></div>
      <div class="stat"><div class="num" id="savedStat">0</div><div>서술 저장 수</div></div>
    </div>
  </div>

  <script>
    const items = [
      {id:1, part:"건강개념", question:"건강의 정의를 설명하시오.", answer:"WHO(1948)는 건강을 '단순히 질병이나 허약이 없는 상태가 아니라 신체적, 정신적, 사회적으로 완전한 안녕 상태'라고 정의하였다."},
      {id:2, part:"건강개념", question:"WHO의 건강 정의를 설명하시오.", answer:"WHO(1948)는 건강을 '단순히 질병이나 허약이 없는 상태가 아니라 신체적, 정신적, 사회적으로 완전한 안녕 상태'라고 정의하였다."},
      {id:3, part:"건강개념", question:"사회적 건강의 의미를 설명하시오.", answer:"Parson에 따르면 건강은 각 개인이 사회적 역할과 임무를 효과적으로 수행할 수 있는 최적의 상태이며, 사회적 건강은 이와 관련된다."},
      {id:4, part:"건강개념", question:"Claude Bernard의 건강관을 설명하시오.", answer:"Claude Bernard는 외부환경이 변하여도 내부환경은 일정하게 유지되는 상태를 건강으로 보았다."},
      {id:5, part:"건강개념", question:"Wylie의 건강관을 설명하시오.", answer:"Wylie는 건강을 유기체가 외부환경의 조건에 부단히 잘 적응해 나가는 상태로 보았다."},
      {id:6, part:"건강개념", question:"Parson의 건강관을 설명하시오.", answer:"Parson은 건강을 각 개인이 사회적 역할과 임무를 효과적으로 수행할 수 있는 최적의 상태라고 하였다."},
      {id:7, part:"건강개념", question:"건강개념 변천의 4가지 모형을 쓰시오.", answer:"생태학적 모형, 사회생태학적 모형, WHO 모형, 전인적 모형이다."},
      {id:8, part:"건강개념", question:"생태학적 모형을 설명하시오.", answer:"생태학적 모형은 숙주, 환경, 병인 간의 균형과 상호관계 속에서 건강과 질병을 설명하는 모형이다."},
      {id:9, part:"건강개념", question:"사회생태학적 모형을 설명하시오.", answer:"사회생태학적 모형은 건강과 질병을 생물학적 요인뿐 아니라 사회적 환경과 구조를 포함하여 설명하는 모형이다."},
      {id:10, part:"건강개념", question:"WHO 모형을 설명하시오.", answer:"WHO 모형은 건강을 신체적, 정신적, 사회적으로 완전한 안녕 상태로 보는 모형이다."},
      {id:11, part:"건강개념", question:"전인적 모형을 설명하시오.", answer:"전인적 모형은 유전적 요인, 환경적 요인, 생활양식, 보건의료조직 등을 함께 고려하는 모형이다."},
      {id:12, part:"건강개념", question:"건강개념의 변천을 설명하시오.", answer:"건강개념은 단순히 질병이 없는 상태에서 벗어나 적응, 사회적 역할 수행, 전인적 안녕을 포함하는 방향으로 확대되었다."},
      {id:13, part:"건강개념", question:"건강과 질병의 결정요인을 설명하시오.", answer:"건강과 질병은 인간의 생물학적 요인, 유전, 생활양식, 사회·경제·문화적 환경, 정치적 환경, 보건의료체계 등 다양한 요인에 의해 결정된다."},
      {id:14, part:"건강개념", question:"건강문제를 전체적 입장에서 이해해야 하는 이유를 설명하시오.", answer:"건강문제는 하나의 원인만이 아니라 여러 요인이 복합적으로 작용하므로 전체적인 입장에서 이해해야 한다."},
      {id:15, part:"건강개념", question:"건강증진의 의미를 설명하시오.", answer:"건강증진은 적극적인 건강 향상과 건강수준 증대를 위한 과정과 노력을 의미한다."},
      {id:16, part:"건강개념", question:"건강을 사회적 역할 수행과 연결하여 설명한 학자는 누구인가?", answer:"Parson이다."},

      {id:17, part:"질병과 예방", question:"질병의 개념을 설명하시오.", answer:"질병은 신체적·정신적·사회적 기능이 정상 범위를 벗어나 생활에 지장을 주는 상태를 말한다."},
      {id:18, part:"질병과 예방", question:"질병 발생의 3요소를 설명하시오.", answer:"질병 발생의 3요소는 숙주(Host), 환경(Environment), 병인(Agent)이다."},
      {id:19, part:"질병과 예방", question:"숙주(Host)를 설명하시오.", answer:"숙주(Host)는 질병에 걸리는 인간 또는 생물체를 말하며 연령, 성별, 유전, 면역상태 등이 영향을 미친다."},
      {id:20, part:"질병과 예방", question:"환경(Environment)을 설명하시오.", answer:"환경(Environment)은 물리적, 화학적, 생물학적, 사회적 환경을 포함하며 질병 발생에 영향을 준다."},
      {id:21, part:"질병과 예방", question:"병인(Agent)을 설명하시오.", answer:"병인(Agent)은 질병을 일으키는 직접적인 원인으로 생물학적, 화학적, 물리적 요인을 포함한다."},
      {id:22, part:"질병과 예방", question:"결함(Impairment)의 개념을 설명하시오.", answer:"결함(Impairment)은 심리적, 생리적, 해부학적 구조나 기능의 상실 또는 이상을 의미한다."},
      {id:23, part:"질병과 예방", question:"장애(Disability)의 개념을 설명하시오.", answer:"장애(Disability)는 결함 때문에 정상적인 활동을 수행하는 능력이 제한되거나 결여된 상태이다."},
      {id:24, part:"질병과 예방", question:"불구(Handicap)의 개념을 설명하시오.", answer:"불구(Handicap)는 결함이나 장애로 인하여 사회적 역할 수행에 불이익을 받는 상태이다."},
      {id:25, part:"질병과 예방", question:"결함, 장애, 불구를 비교하시오.", answer:"결함은 기능이나 구조의 손상, 장애는 활동능력의 제한, 불구는 사회적 역할 수행의 제한을 의미한다."},
      {id:26, part:"질병과 예방", question:"질병의 자연사를 설명하시오.", answer:"질병의 자연사는 질병 발생 이전부터 회복 또는 사망에 이르기까지 질병이 진행하는 전 과정을 말한다."},
      {id:27, part:"질병과 예방", question:"질병의 자연사를 예방적 관점에서 설명하시오.", answer:"질병의 자연사는 질병발생 전 단계, 질병발생 단계, 회복 또는 후유증 단계로 이어지며 이에 따라 1차적 예방, 2차적 예방, 3차적 예방이 적용된다."},
      {id:28, part:"질병과 예방", question:"질병예방의 3단계를 설명하시오.", answer:"1차적 예방은 질병발생 억제단계, 2차적 예방은 조기발견과 조기치료단계, 3차적 예방은 재활 및 사회복귀단계이다."},
      {id:29, part:"질병과 예방", question:"1차적 예방을 설명하시오.", answer:"1차적 예방은 질병발생 억제단계로 예방접종, 환경개선, 영양섭취 등과 생활조건 개선, 체력관리, 보건지식 습득 등을 포함한다."},
      {id:30, part:"질병과 예방", question:"2차적 예방을 설명하시오.", answer:"2차적 예방은 조기발견과 조기치료단계로 질병을 조기에 발견하여 치료기간을 단축하고 예후를 좋게 하는 것이다."},
      {id:31, part:"질병과 예방", question:"3차적 예방을 설명하시오.", answer:"3차적 예방은 재활 및 사회복귀단계로 의학적 재활, 직업적 재활 등을 통해 기능회복과 사회복귀를 돕는다."},
      {id:32, part:"질병과 예방", question:"전염성 질환과 비전염성 질환의 2차적 예방 차이를 간단히 설명하시오.", answer:"전염성 질환은 전염기회를 최소화하여 질병전파를 막고 치료기간을 최소화하며, 비전염성 질환은 조기발견을 통해 치료기간 단축과 생존율 증가를 도모한다."},

      {id:33, part:"공중보건학", question:"공중보건학의 정의를 설명하시오.", answer:"공중보건학은 조직화된 지역사회의 노력을 통하여 질병을 예방하고 수명을 연장하며 건강과 능률을 증진시키는 과학이자 기술이다."},
      {id:34, part:"공중보건학", question:"Winslow의 공중보건학 정의를 설명하시오.", answer:"Winslow는 공중보건학을 조직화된 지역사회의 노력을 통하여 질병을 예방하고 수명을 연장하며 건강과 능률을 증진시키는 과학이자 기술이라고 하였다."},
      {id:35, part:"공중보건학", question:"공중보건학의 목적을 설명하시오.", answer:"공중보건학의 목적은 질병예방, 수명연장, 건강증진을 통하여 지역사회 주민의 건강수준을 향상시키는 데 있다."},
      {id:36, part:"공중보건학", question:"공중보건학과 예방의학의 차이를 설명하시오.", answer:"예방의학은 개인과 가족을 대상으로 하고, 공중보건학은 지역사회 주민 전체를 대상으로 한다."},
      {id:37, part:"공중보건학", question:"공중보건학의 범위를 설명하시오.", answer:"공중보건학의 범위에는 보건관리, 환경관련 분야, 질병관리 분야 등이 포함된다."},
      {id:38, part:"공중보건학", question:"공중보건학이 지역사회 중심 학문인 이유를 설명하시오.", answer:"공중보건학은 개인이 아니라 지역사회 주민 전체의 건강문제를 다루기 때문이다."},
      {id:39, part:"공중보건학", question:"공중보건학의 발전과정을 설명하시오.", answer:"공중보건학은 고대기, 중세기, 여명기, 확립기, 발전기를 거치며 발전하였다."},
      {id:40, part:"공중보건학", question:"Jenner의 업적을 설명하시오.", answer:"Jenner는 종두법을 개발하여 예방의학과 공중보건학 발전에 기여하였다."},
      {id:41, part:"공중보건학", question:"Chadwick의 업적을 설명하시오.", answer:"Chadwick은 영국의 위생개혁을 이끌고 공중보건법 제정에 기여하였다."},
      {id:42, part:"공중보건학", question:"John Snow의 업적을 설명하시오.", answer:"John Snow는 콜레라의 원인을 역학적으로 조사하여 현대 역학 발전에 기여하였다."},
      {id:43, part:"공중보건학", question:"Alma-Ata 회의의 의의를 설명하시오.", answer:"Alma-Ata 회의는 일차보건의료(Primary Health Care)의 중요성을 강조하였다."},
      {id:44, part:"공중보건학", question:"Ottawa 회의의 의의를 설명하시오.", answer:"Ottawa 회의는 건강증진(Health Promotion)의 개념과 전략을 확산시켰다."},
      {id:45, part:"공중보건학", question:"공중보건학에서 조직화된 지역사회 노력이 중요한 이유를 설명하시오.", answer:"건강문제는 지역사회 차원의 환경과 제도, 조직적 노력이 함께 작용해야 해결할 수 있기 때문이다."},

      {id:46, part:"보건행정", question:"보건행정의 정의를 설명하시오.", answer:"보건행정이란 공중보건의 목적을 달성하기 위하여 공중보건의 원리를 적용하여 행정조직을 통하여 행하는 일련의 과정이다."},
      {id:47, part:"보건행정", question:"W. G. Smillie의 보건행정 정의를 설명하시오.", answer:"W. G. Smillie(1930)는 보건행정을 공적(official) 또는 사적(unofficial) 기관이 사회복지를 위하여 공중보건의 원리와 기법을 응용하는 것이라고 하였다."},
      {id:48, part:"보건행정", question:"보건행정의 특성을 설명하시오.", answer:"보건행정의 특성은 공공성 및 사회성, 조장성 및 교육성, 봉사성, 과학성이다."},
      {id:49, part:"보건행정", question:"공공성 및 사회성을 설명하시오.", answer:"공공성 및 사회성은 공공복지와 집단의 건강을 증진하는 공공이익을 위한 특성이다."},
      {id:50, part:"보건행정", question:"조장성 및 교육성을 설명하시오.", answer:"조장성 및 교육성은 지역사회 주민을 교육 또는 조장함으로써 목적을 달성하는 특성이며 보건행정은 교육을 주된 수단으로 한다."},
      {id:51, part:"보건행정", question:"봉사성을 설명하시오.", answer:"봉사성은 현대국가 행정의 특징인 적극적인 서비스를 하는 특성이다."},
      {id:52, part:"보건행정", question:"과학성을 설명하시오.", answer:"과학성은 발전된 과학과 기술의 확고한 기초 위에 수립된 행정적 특성이다."},
      {id:53, part:"보건행정", question:"POSDCORB를 설명하시오.", answer:"POSDCORB는 Planning(기획), Organizing(조직), Staffing(인사), Directing(지휘), Coordinating(조정), Reporting(보고), Budgeting(예산)을 의미한다."},
      {id:54, part:"보건행정", question:"Planning(기획)을 설명하시오.", answer:"Planning(기획)은 목표를 설정하고 그 목표를 달성하기 위한 방법과 절차를 미리 결정하는 것이다."},
      {id:55, part:"보건행정", question:"Organizing(조직)을 설명하시오.", answer:"Organizing(조직)은 목표달성을 위해 업무를 분담하고 권한과 책임을 배분하는 것이다."},
      {id:56, part:"보건행정", question:"Staffing(인사)을 설명하시오.", answer:"Staffing(인사)은 필요한 인력을 확보하고 배치하며 교육·훈련하는 것이다."},
      {id:57, part:"보건행정", question:"Directing(지휘)을 설명하시오.", answer:"Directing(지휘)은 조직구성원이 목표를 향해 행동하도록 지도하고 감독하는 것이다."},
      {id:58, part:"보건행정", question:"의사결정 과정을 설명하시오.", answer:"의사결정은 문제의 인식, 정보수집, 대안설정, 대안비교, 최종선택, 집행 및 평가의 과정을 거친다."},

      {id:59, part:"보건소와 조직", question:"보건소의 역할을 설명하시오.", answer:"보건소는 지역주민의 건강을 보호하고 증진하기 위한 지역보건기관으로서 국민건강증진, 보건교육, 구강건강 및 영양개선사업, 감염병 예방 및 관리, 모자보건, 노인보건, 정신보건, 방문보건, 만성질환 관리 등을 수행한다."},
      {id:60, part:"보건소와 조직", question:"보건소의 감염병 예방 기능을 설명하시오.", answer:"보건소는 감염병 예방 및 관리, 예방접종, 보건교육, 지역사회 대응 등의 기능을 수행한다."},
      {id:61, part:"보건소와 조직", question:"보건소의 모자보건 기능을 설명하시오.", answer:"보건소는 모자보건 및 가족계획사업을 수행한다."},
      {id:62, part:"보건소와 조직", question:"보건소의 노인보건 기능을 설명하시오.", answer:"보건소는 노인보건사업을 수행한다."},
      {id:63, part:"보건소와 조직", question:"보건소의 정신보건 기능을 설명하시오.", answer:"보건소는 정신보건사업을 수행한다."},
      {id:64, part:"보건소와 조직", question:"보건소의 방문보건 기능을 설명하시오.", answer:"보건소는 지역주민에게 방문보건사업을 수행한다."},
      {id:65, part:"보건소와 조직", question:"중앙보건행정조직과 지방보건행정조직을 설명하시오.", answer:"중앙보건행정조직은 국가 차원의 보건정책을 수립·총괄하고, 지방보건행정조직은 지역사회에서 보건사업을 집행한다."},
      {id:66, part:"보건소와 조직", question:"보건복지부의 역할을 설명하시오.", answer:"보건복지부는 국민의 생활 수준 향상과 사회보장 증진을 위해 보건·의료·복지·인구 분야 정책을 수립·집행하는 중앙행정기관이다."},
      {id:67, part:"보건소와 조직", question:"보건복지부의 조직체계를 설명하시오.", answer:"보건복지부는 장관 아래 복수차관제를 두며 제1차관은 복지·인구 분야, 제2차관은 보건·의료 분야를 담당한다."},
      {id:68, part:"보건소와 조직", question:"보건복지부의 복수차관제를 설명하시오.", answer:"보건복지부는 제1차관(복지·인구 분야)과 제2차관(보건·의료 분야)으로 이루어진 복수차관제를 운영한다."},
      {id:69, part:"보건소와 조직", question:"장관 직속 조직의 예를 쓰시오.", answer:"장관 직속 조직에는 대변인, 감사관, 장관정책보좌관이 있다."},
      {id:70, part:"보건소와 조직", question:"제1차관과 제2차관의 관할 분야를 비교하시오.", answer:"제1차관은 복지·인구 분야를, 제2차관은 보건·의료 분야를 담당한다."},

      {id:71, part:"사회보장과 건강보험", question:"사회보장의 개념을 설명하시오.", answer:"사회보장은 질병, 장애, 노령, 실업, 사망 등의 사회적 위험으로부터 국민을 보호하고 생활의 질을 향상시키기 위한 제도이다."},
      {id:72, part:"사회보장과 건강보험", question:"사회보장의 체계를 설명하시오.", answer:"사회보장의 체계는 사회보험, 공적부조, 사회복지서비스 및 관련 복지제도로 구성된다."},
      {id:73, part:"사회보장과 건강보험", question:"사회보험과 공적부조의 차이를 설명하시오.", answer:"사회보험은 보험원리에 따라 운영되는 제도이고, 공적부조는 생활이 어려운 사람에게 국가가 최저생활을 보장하는 제도이다."},
      {id:74, part:"사회보장과 건강보험", question:"사회보험, 공적부조, 사회복지서비스를 비교하시오.", answer:"사회보험은 보험원리에 따른 제도이고, 공적부조는 국가가 생활보호를 제공하는 제도이며, 사회복지서비스는 도움이 필요한 사람에게 상담·보호·재활 등의 서비스를 제공하는 제도이다."},
      {id:75, part:"사회보장과 건강보험", question:"건강보험의 원리를 설명하시오.", answer:"건강보험은 다수의 국민이 보험료를 부담하고 질병 발생 시 보험급여를 받는 사회보험 방식의 제도이다."},
      {id:76, part:"사회보장과 건강보험", question:"건강보험과 의료급여의 차이를 설명하시오.", answer:"건강보험은 사회보험이고, 의료급여는 생활이 어려운 국민에게 국가가 의료비를 지원하는 제도이다."},
      {id:77, part:"사회보장과 건강보험", question:"의료보장의 기능을 설명하시오.", answer:"의료보장의 기능은 최저생활 보장, 위험분산, 국민연대, 소득재분배, 의료이용 보장이다."},

      {id:78, part:"국제보건", question:"WHO의 목적을 설명하시오.", answer:"WHO의 목적은 모든 인류가 가능한 최고 수준의 건강에 도달하도록 하는 데 있다."},
      {id:79, part:"국제보건", question:"국제보건의 필요성을 설명하시오.", answer:"국제보건은 감염병, 재난, 영양문제 등 국경을 넘는 건강문제를 공동으로 해결하기 위해 필요하다."},
      {id:80, part:"국제보건", question:"WHO의 역할을 설명하시오.", answer:"WHO는 국제적 보건정책 조정, 건강기준 제시, 감염병 대응, 기술 지원 등의 역할을 수행한다."}

    let current = null;
    let currentPool = [];
    let examMode = false;
    let examType = "";
    let examQuestions = [];
    let examIndex = 0;
    let examScore = 0;
    let examAnswered = false;

    let stats = JSON.parse(localStorage.getItem("ph_stats_fast") || "{}");
    let wrongNotes = JSON.parse(localStorage.getItem("ph_wrong_fast") || "[]");
    let userShortAnswers = JSON.parse(localStorage.getItem("ph_short_fast") || "{}");

    function saveAll() {
      localStorage.setItem("ph_stats_fast", JSON.stringify(stats));
      localStorage.setItem("ph_wrong_fast", JSON.stringify(wrongNotes));
      localStorage.setItem("ph_short_fast", JSON.stringify(userShortAnswers));
    }

    function initStats() {
      items.forEach(item => {
        if (!stats[item.id]) {
          stats[item.id] = { seen:false, hard:false, known:false, correct:0, wrong:0 };
        }
      });
      saveAll();
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function clearBoxes() {
      document.getElementById("choicesBox").innerHTML = "";
      document.getElementById("answerBox").style.display = "none";
      document.getElementById("answerBox").textContent = "";
      document.getElementById("compareBox").style.display = "none";
      document.getElementById("compareBox").textContent = "";
      document.getElementById("wrongBox").style.display = "none";
      document.getElementById("wrongBox").textContent = "";
    }

    function updateStats() {
      document.getElementById("totalStat").textContent = items.length;
      document.getElementById("seenStat").textContent = items.filter(x => stats[x.id].seen).length;
      document.getElementById("hardStat").textContent = items.filter(x => stats[x.id].hard).length;
      document.getElementById("knownStat").textContent = items.filter(x => stats[x.id].known).length;
      document.getElementById("savedStat").textContent = Object.keys(userShortAnswers).length;

      let c = 0, t = 0;
      items.forEach(x => {
        c += stats[x.id].correct;
        t += stats[x.id].correct + stats[x.id].wrong;
      });
      document.getElementById("accStat").textContent = (t ? Math.round(c/t*100) : 0) + "%";
    }

    function getFiltered() {
      const part = document.getElementById("part").value;
      const filter = document.getElementById("filter").value;
      const search = document.getElementById("search").value.trim().toLowerCase();

      return items.filter(item => {
        if (part !== "all" && item.part !== part) return false;
        if (filter === "hard" && !stats[item.id].hard) return false;
        if (filter === "unseen" && stats[item.id].seen) return false;
        if (search) {
          const text = (item.question + " " + item.answer + " " + item.part).toLowerCase();
          if (!text.includes(search)) return false;
        }
        return true;
      });
    }

    function renderShort(item) {
      document.getElementById("shortArea").style.display = "block";
      document.getElementById("questionBox").textContent = item.question;
      document.getElementById("userAnswer").value = userShortAnswers[item.id] || "";
    }

    function getWrongChoices(item) {
      const samePart = items.filter(x => x.part === item.part && x.id !== item.id).map(x => x.answer);
      const fallback = items.filter(x => x.id !== item.id).map(x => x.answer);
      const pool = [...new Set([...samePart, ...fallback])].filter(x => x !== item.answer);
      return shuffle(pool).slice(0, 3);
    }

    function renderMCQ(item, isExam=false) {
      document.getElementById("questionBox").textContent = item.question;
      const choices = shuffle([item.answer, ...getWrongChoices(item)]);
      const correctAnswer = item.answer;
      const box = document.getElementById("choicesBox");
      box.innerHTML = "";

      choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = `${idx+1}. ${choice}`;
        btn.onclick = () => {
          const all = Array.from(document.querySelectorAll(".choice"));
          all.forEach(b => b.disabled = true);

          if (choice === correctAnswer) {
            btn.classList.add("correct");
            stats[item.id].correct += 1;
            if (isExam) examScore++;
          } else {
            btn.classList.add("wrong");
            all.forEach(b => {
              const txt = b.textContent.replace(/^\d+\.\s*/, "");
              if (txt === correctAnswer) b.classList.add("correct");
            });
            stats[item.id].wrong += 1;
            wrongNotes.unshift({
              time: new Date().toLocaleString(),
              part: item.part,
              mode: isExam ? "모의고사 객관식" : "객관식",
              question: item.question,
              userChoice: choice,
              correctAnswer: correctAnswer,
              answer: item.answer
            });
            if (wrongNotes.length > 120) wrongNotes = wrongNotes.slice(0,120);
          }

          saveAll();
          updateStats();

          const ans = document.getElementById("answerBox");
          ans.style.display = "block";
          ans.textContent = `정답: ${correctAnswer}\n\n모범답안:\n${item.answer}`;

          if (isExam) {
            examAnswered = true;
            updateExamStatus();
          }
        };
        box.appendChild(btn);
      });
    }

    function renderOX(item, isExam=false) {
      document.getElementById("questionBox").textContent = item.question;
      const isTrue = Math.random() < 0.5;
      const statement = isTrue ? item.answer : oxFalseMap[item.id];
      const box = document.getElementById("choicesBox");
      box.innerHTML = "";

      const statementDiv = document.createElement("div");
      statementDiv.style.padding = "12px";
      statementDiv.style.background = "#f9fafb";
      statementDiv.style.border = "1px solid #e5e7eb";
      statementDiv.style.borderRadius = "12px";
      statementDiv.style.lineHeight = "1.7";
      statementDiv.innerHTML = `<strong>판단 문장</strong><br>${statement}`;
      box.appendChild(statementDiv);

      ["O","X"].forEach(mark => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = mark;
        btn.onclick = () => {
          const all = Array.from(document.querySelectorAll(".choice"));
          all.forEach(b => b.disabled = true);

          const correct = (mark === "O" && isTrue) || (mark === "X" && !isTrue);

          if (correct) {
            btn.classList.add("correct");
            stats[item.id].correct += 1;
            if (isExam) examScore++;
          } else {
            btn.classList.add("wrong");
            stats[item.id].wrong += 1;
            wrongNotes.unshift({
              time: new Date().toLocaleString(),
              part: item.part,
              mode: isExam ? "모의고사 OX" : "OX",
              question: item.question,
              userChoice: mark,
              correctAnswer: isTrue ? "O" : "X",
              answer: item.answer
            });
            if (wrongNotes.length > 120) wrongNotes = wrongNotes.slice(0,120);
          }

          saveAll();
          updateStats();

          const ans = document.getElementById("answerBox");
          ans.style.display = "block";
          ans.textContent = `정답: ${isTrue ? "O" : "X"}\n\n모범답안:\n${item.answer}`;

          if (isExam) {
            examAnswered = true;
            updateExamStatus();
          }
        };
        box.appendChild(btn);
      });
    }

    function renderNormal() {
      if (examMode) return;

      clearBoxes();
      currentPool = getFiltered();
      const mode = document.getElementById("mode").value;

      document.getElementById("badgeMode").textContent = mode === "short" ? "서술형" : mode === "mcq" ? "객관식 4지선다" : "OX";
      document.getElementById("badgeCount").textContent = `현재 조건 ${currentPool.length}문제`;

      if (currentPool.length === 0) {
        document.getElementById("metaText").textContent = "조건에 맞는 문제가 없습니다.";
        document.getElementById("questionBox").textContent = "필터나 검색 조건을 바꿔보세요.";
        document.getElementById("shortArea").style.display = "none";
        return;
      }

      current = currentPool[Math.floor(Math.random() * currentPool.length)];
      stats[current.id].seen = true;
      saveAll();
      updateStats();

      document.getElementById("badgePart").textContent = current.part;
      document.getElementById("metaText").textContent = `파트: ${current.part}`;

      if (mode === "short") {
        renderShort(current);
      } else {
        document.getElementById("shortArea").style.display = "none";
        if (mode === "mcq") renderMCQ(current, false);
        if (mode === "ox") renderOX(current, false);
      }
    }

    function showAnswer() {
      if (!current) return;
      const mode = document.getElementById("mode").value;

      if (mode === "short") {
        compareAnswer();
      } else {
        const ans = document.getElementById("answerBox");
        ans.style.display = "block";
        ans.textContent = current.answer;
      }
    }

    function saveShort() {
      if (!current) return;
      const val = document.getElementById("userAnswer").value;
      userShortAnswers[current.id] = val;
      saveAll();
      updateStats();
      alert("내 답을 저장했어.");

      if (examMode && examType === "short") {
        examAnswered = val.trim().length > 0;
        updateExamStatus();
      }
    }

    function compareAnswer() {
      if (!current) return;
      const mine = document.getElementById("userAnswer").value.trim();
      const box = document.getElementById("compareBox");
      box.style.display = "block";
      box.textContent = `내 답:\n${mine || "(작성 안 함)"}\n\n모범답안:\n${current.answer}`;
    }

    function markKnown() {
      if (!current) return;
      stats[current.id].known = true;
      stats[current.id].hard = false;
      saveAll();
      updateStats();
      alert("외웠음으로 표시했어.");
    }

    function markHard() {
      if (!current) return;
      stats[current.id].hard = true;
      saveAll();
      updateStats();
      alert("어려움 문제로 표시했어.");
    }

    function showWrongNotes() {
      const box = document.getElementById("wrongBox");
      if (wrongNotes.length === 0) {
        box.style.display = "block";
        box.textContent = "아직 기록된 오답이 없어.";
        return;
      }
      let text = "오답노트\n\n";
      wrongNotes.slice(0, 25).forEach((n, i) => {
        text += `${i+1}. [${n.part}] ${n.question}\n- 내가 고른 답: ${n.userChoice}\n- 정답: ${n.correctAnswer}\n- 모범답안: ${n.answer}\n- 기록 시각: ${n.time}\n\n`;
      });
      box.style.display = "block";
      box.textContent = text;
    }

    function updateExamStatus() {
      const box = document.getElementById("examBox");
      const btns = document.getElementById("examControlBtns");

      if (!examMode) {
        box.style.display = "none";
        btns.style.display = "none";
        return;
      }

      box.style.display = "block";
      btns.style.display = "flex";

      if (examType === "mcq") {
        box.textContent = `객관식 20문제 시험 | 문항 ${examIndex+1}/${examQuestions.length} | 현재 점수 ${examScore}점 | ${examAnswered ? "답안 선택 완료" : "답안 선택 전"}`;
      } else {
        box.textContent = `서술형 10문제 시험 | 문항 ${examIndex+1}/${examQuestions.length} | ${examAnswered ? "작성 완료" : "작성 미완료"}`;
      }
    }

    function renderExamQuestion() {
      clearBoxes();

      if (examIndex >= examQuestions.length) {
        finishExam();
        return;
      }

      current = examQuestions[examIndex];
      stats[current.id].seen = true;
      saveAll();
      updateStats();

      document.getElementById("badgePart").textContent = current.part;
      document.getElementById("badgeMode").textContent = examType === "mcq" ? "객관식 시험" : "서술형 시험";
      document.getElementById("badgeCount").textContent = `시험 ${examIndex+1}/${examQuestions.length}`;
      document.getElementById("metaText").textContent = "시험 모드 진행 중";

      if (examType === "mcq") {
        document.getElementById("shortArea").style.display = "none";
        renderMCQ(current, true);
        examAnswered = false;
      } else {
        document.getElementById("shortArea").style.display = "block";
        document.getElementById("questionBox").textContent = current.question;
        document.getElementById("userAnswer").value = userShortAnswers[current.id] || "";
        examAnswered = (userShortAnswers[current.id] || "").trim().length > 0;
      }

      updateExamStatus();
    }

    function startMcqExam() {
      examMode = true;
      examType = "mcq";
      examIndex = 0;
      examScore = 0;
      examQuestions = shuffle(items).slice(0,20);
      renderExamQuestion();
    }

    function startShortExam() {
      examMode = true;
      examType = "short";
      examIndex = 0;
      examScore = 0;
      examQuestions = shuffle(items).slice(0,10);
      renderExamQuestion();
    }

    function nextExamQuestion() {
      if (!examMode) return;

      if (examType === "mcq" && !examAnswered) {
        alert("먼저 답을 선택해줘.");
        return;
      }

      if (examType === "short") {
        const val = document.getElementById("userAnswer").value.trim();
        userShortAnswers[current.id] = val;
        saveAll();
        examAnswered = val.length > 0;
      }

      examIndex++;
      renderExamQuestion();
    }

    function finishExam() {
      clearBoxes();
      document.getElementById("shortArea").style.display = "none";

      if (examType === "mcq") {
        document.getElementById("questionBox").textContent = `객관식 시험 종료! 총점: ${examScore} / ${examQuestions.length}`;
      } else {
        const answered = examQuestions.filter(q => (userShortAnswers[q.id] || "").trim().length > 0).length;
        document.getElementById("questionBox").textContent = `서술형 시험 종료! 작성한 문항 수: ${answered} / ${examQuestions.length}`;
      }

      document.getElementById("metaText").textContent = "오답노트 보기나 서술형 비교 기능으로 복습해봐.";
      document.getElementById("examBox").style.display = "none";
      document.getElementById("examControlBtns").style.display = "none";
      examMode = false;
      examType = "";
    }

    function resetAll() {
      if (!confirm("학습 기록, 오답노트, 서술형 답안을 모두 초기화할까요?")) return;
      stats = {};
      wrongNotes = [];
      userShortAnswers = {};
      examMode = false;
      examType = "";
      examQuestions = [];
      examIndex = 0;
      examScore = 0;
      examAnswered = false;
      initStats();
      updateStats();
      clearBoxes();
      document.getElementById("examBox").style.display = "none";
      document.getElementById("examControlBtns").style.display = "none";
      renderNormal();
    }

    document.getElementById("newBtn").addEventListener("click", renderNormal);
    document.getElementById("showBtn").addEventListener("click", showAnswer);
    document.getElementById("knownBtn").addEventListener("click", markKnown);
    document.getElementById("hardBtn").addEventListener("click", markHard);
    document.getElementById("wrongBtn").addEventListener("click", showWrongNotes);
    document.getElementById("resetBtn").addEventListener("click", resetAll);
    document.getElementById("mcqExamBtn").addEventListener("click", startMcqExam);
    document.getElementById("shortExamBtn").addEventListener("click", startShortExam);
    document.getElementById("saveShortBtn").addEventListener("click", saveShort);
    document.getElementById("compareBtn").addEventListener("click", compareAnswer);
    document.getElementById("nextExamBtn").addEventListener("click", nextExamQuestion);
    document.getElementById("finishExamBtn").addEventListener("click", finishExam);

    document.getElementById("mode").addEventListener("change", () => { if (!examMode) renderNormal(); });
    document.getElementById("part").addEventListener("change", () => { if (!examMode) renderNormal(); });
    document.getElementById("filter").addEventListener("change", () => { if (!examMode) renderNormal(); });
    document.getElementById("search").addEventListener("input", () => { if (!examMode) renderNormal(); });

    initStats();
    updateStats();
    renderNormal();
  </script>
</body>
</html>
