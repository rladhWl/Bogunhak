<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일반생물학 파이널 최종 완성본 v4</title>
<style>
  :root { --pri:#2563eb; --pri-bg:#dbeafe; --role-bg:#dcfce7; --role-txt:#166534; --acc:#f59e0b; --bg:#f1f5f9; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Pretendard',sans-serif; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  body { background:var(--bg); color:#0f172a; line-height:1.55; padding-bottom:220px; }
  button, .t-n, .t-r, .aa-card, .q-opt { cursor:pointer; user-select:none; -webkit-user-select:none; }
  header { background:linear-gradient(135deg,#0f172a,#1e3a8a); color:#fff; padding:12px; text-align:center; position:sticky; top:0; z-index:100; }
  header h1 { font-size:1.08rem; font-weight:800; }
  header p { font-size:0.74rem; color:#fde047; margin-top:3px; font-weight:700; }
  .nav { display:flex; gap:4px; justify-content:center; background:#fff; padding:8px 4px; border-bottom:1px solid #cbd5e1; position:sticky; top:52px; z-index:95; flex-wrap:wrap; }
  .nav-b { padding:7px 10px; border:1px solid #cbd5e1; border-radius:99px; background:#f8fafc; font-weight:800; font-size:0.76rem; color:#334155; }
  .nav-b.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .b-bar { display:flex; gap:5px; justify-content:center; align-items:center; background:#eff6ff; padding:6px; border-bottom:1px solid #bfdbfe; position:sticky; top:94px; z-index:90; flex-wrap:wrap; font-size:0.75rem; }
  .b-btn { padding:5px 9px; border-radius:8px; border:1px solid #93c5fd; background:#fff; color:#1e3a8a; font-weight:800; font-size:0.74rem; }
  .b-btn.on { background:#0f172a; color:#fde047; border-color:#0f172a; }
  .wrap { max-width:900px; margin:10px auto; padding:0 10px; }
  .sec { display:none; }
  .sec.on { display:block; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid #cbd5e1; box-shadow:0 2px 5px rgba(0,0,0,0.04); }
  .bdg { display:inline-block; padding:2px 8px; border-radius:6px; font-size:0.71rem; font-weight:800; background:var(--pri-bg); color:#1d4ed8; margin-bottom:5px; }
  .bdg.hot { background:#fee2e2; color:#dc2626; margin-left:4px; }
  .c-title { font-size:0.98rem; font-weight:800; margin-bottom:8px; }
  .svg-box { background:#f8fafc; border:1px dashed #cbd5e1; border-radius:10px; padding:8px; margin:8px 0; text-align:center; }
  table { width:100%; border-collapse:collapse; font-size:0.84rem; margin-top:4px; }
  th, td { border:1px solid #cbd5e1; padding:7px 8px; text-align:left; vertical-align:top; }
  th { background:#f8fafc; font-weight:800; width:26%; }
  .t-n { display:inline-block; background:var(--pri-bg); color:#1e3a8a; font-weight:800; padding:1px 6px; border-radius:4px; border-bottom:2px solid #3b82f6; margin:1px; }
  .t-r { display:inline; background:var(--role-bg); color:var(--role-txt); font-weight:700; padding:1px 5px; border-radius:4px; border-bottom:2px dashed #16a34a; }
  body.hide-n .t-n:not(.show) { background:#1e293b; color:transparent; border-color:#0f172a; }
  body.hide-r .t-r:not(.show) { background:#064e3b; color:transparent; border-color:#022c22; }
  #dock { position:fixed; bottom:0; left:0; right:0; background:#0f172a; color:#fff; padding:13px 15px; z-index:200; border-top:3px solid var(--acc); box-shadow:0 -4px 20px rgba(0,0,0,0.35); transform:translateY(105%); transition:0.2s; max-height:46vh; overflow-y:auto; }
  #dock.on { transform:translateY(0); }
  .d-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .d-tit { font-size:0.95rem; font-weight:800; color:#fde047; }
  .d-role { font-size:0.85rem; color:#86efac; font-weight:700; margin-bottom:5px; }
  .d-why { font-size:0.83rem; color:#e2e8f0; background:#1e293b; padding:8px 10px; border-radius:8px; border-left:3px solid #38bdf8; }
  .aa-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .aa-card { background:#fff; border-radius:12px; border:2px solid #cbd5e1; padding:8px; text-align:center; }
  .aa-svg { background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0; height:132px; display:flex; align-items:center; justify-content:center; margin:4px 0; }
  .aa-hide-n .aa-nm, .aa-hide-c .aa-cd, .aa-hide-r .r-g { opacity:0; }
  .warn-c { background:#fee2e2; color:#dc2626; padding:1px 5px; border-radius:4px; font-weight:900; }
  .inp { padding:5px; border:2px solid #94a3b8; border-radius:6px; width:115px; font-weight:700; text-align:center; margin:2px; }
  .q-opt { display:block; width:100%; text-align:left; padding:9px 11px; margin-bottom:6px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; font-size:0.85rem; }
  .q-opt.ok { background:#dcfce7; border-color:#10b981; font-weight:800; }
  .q-opt.no { background:#fee2e2; border-color:#ef4444; }
</style>
</head>
<body>

<header>
  <h1>🧬 일반생물학 파이널 최종 완성본 (7p~123p 전 범위)</h1>
  <p>시험 방식: 단답형(용어) 10문제 + 주관식 10문제 중 7문제 선택 | 글자 터치 시 즉시 해설 팝업!</p>
</header>

<div class="nav">
  <button type="button" class="nav-b on" data-tab="sec-role">📌 7p~123p 종류+역할+그림</button>
  <button type="button" class="nav-b" data-tab="sec-comp">⚡ 1:1 비교표 (12선)</button>
  <button type="button" class="nav-b" data-tab="sec-aa">🧪 20종 아미노산 그림</button>
  <button type="button" class="nav-b" data-tab="sec-quiz">📝 실전 문제 (4종·대량)</button>
</div>

<div class="b-bar">
  <span>👆 <b>글자 터치</b>=해설창 |</span>
  <button type="button" class="b-btn" id="bName">🙈 용어(파랑) 가리기</button>
  <button type="button" class="b-btn" id="bRole">🙈 역할(초록) 가리기</button>
  <button type="button" class="b-btn" id="bShow">👀 모두 보기</button>
</div>

<div class="wrap">
  <div id="sec-role" class="sec on"><div id="roleBox"></div></div>
  <div id="sec-comp" class="sec"><div id="compBox"></div></div>
  <div id="sec-aa" class="sec">
    <div class="card" style="display:flex; gap:5px; flex-wrap:wrap; justify-content:space-between;">
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <button type="button" class="b-btn on" data-aaf="all">전체(20)</button>
        <button type="button" class="b-btn" data-aaf="비극성">🟨비극성(9)</button>
        <button type="button" class="b-btn" data-aaf="극성">🟩극성(6)</button>
        <button type="button" class="b-btn" data-aaf="산성">🟥산성(2)</button>
        <button type="button" class="b-btn" data-aaf="염기성">🟦염기성(3)</button>
        <button type="button" class="b-btn" data-aaf="warn">⚠️특이약어(9)</button>
      </div>
      <div style="display:flex; gap:4px;">
        <button type="button" class="b-btn" data-aam="aa-hide-n">이름가림</button>
        <button type="button" class="b-btn" data-aam="aa-hide-c">약어가림</button>
        <button type="button" class="b-btn" data-aam="aa-hide-r">그림가림</button>
      </div>
    </div>
    <div class="aa-grid" id="aaBox"></div>
  </div>
  <div id="sec-quiz" class="sec">
    <div class="card" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:5px;">
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <button type="button" class="b-btn on" data-qt="all">🎲 전체 랜덤</button>
        <button type="button" class="b-btn" data-qt="term">🔑 단답형 용어(10문제 대비)</button>
        <button type="button" class="b-btn" data-qt="blank">✏️ 빈칸 채우기</button>
        <button type="button" class="b-btn" data-qt="essay">🖋️ 주관식 서술형(7택 대비)</button>
        <button type="button" class="b-btn" data-qt="mcq">❌ 옳지 않은 것은?</button>
      </div>
      <button type="button" class="b-btn on" id="nextQBtn">🔄 다음 문제 뽑기</button>
    </div>
    <div class="card" id="quizBox"></div>
  </div>
</div>

<div id="dock">
  <div class="d-top">
    <div class="d-tit" id="dTit">💡 용어 및 역할 해설</div>
    <button type="button" class="b-btn" id="dClose">닫기 ✕</button>
  </div>
  <div class="d-role" id="dRole"></div>
  <div class="d-why" id="dWhy"></div>
</div>

<script>
function N(txt, role, why) { return '<span class="t-n" data-t="'+txt+'" data-r="'+role+'" data-w="'+why+'">'+txt+'</span>'; }
function R(txt, tit, why) { return '<span class="t-r" data-t="'+tit+'" data-r="'+txt+'" data-w="'+why+'">'+txt+'</span>'; }

// 1. 7p~123p 전 범위 종류 + 역할 + 교과서 핵심 모식도 SVG
var ROLES = [
  {
    p:"7~8p / 21~38p", tag:"1~2장 필수 용어·결합·화학기", tit:"1. 유전자 발현 · 유전체학 · 4대 화학 결합 · 7대 화학기 · 탈수반응과 가수분해",
    svg:'<svg width="100%" height="58" viewBox="0 0 440 58"><rect x="8" y="10" width="85" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="50" y="34" text-anchor="middle" font-size="12" font-weight="bold">DNA</text><text x="115" y="25" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">전사</text><path d="M98 30 L132 30" stroke="#2563eb" stroke-width="2"/><rect x="138" y="10" width="85" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="180" y="34" text-anchor="middle" font-size="12" font-weight="bold">mRNA</text><text x="245" y="25" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">번역</text><path d="M228 30 L262 30" stroke="#2563eb" stroke-width="2"/><rect x="268" y="10" width="160" height="38" rx="6" fill="#dcfce7" stroke="#10b981"/><text x="348" y="34" text-anchor="middle" font-size="12" font-weight="bold">단백질 (크리스탈린)</text></svg>',
    rows:[
      [N("유전자 발현 (7p)","DNA 정보가 전사(mRNA)와 번역(단백질)을 거쳐 세포 산물로 만들어지는 전 과정","단답형 용어 1순위! DNA 원본을 보호하기 위해 mRNA 복사본을 만들어 리보솜으로 보냅니다."), R("• 전사(Transcription): DNA 뉴클레오타이드 서열 정보를 이용해 mRNA를 합성하는 과정.<br>• 번역(Translation): 리보솜이 mRNA 서열 정보를 해독해 아미노산 사슬(단백질)을 만드는 과정.","유전자 발현의 단계별 역할","눈의 렌즈 세포는 크리스탈린 유전자를 발현시켜 투명한 크리스탈린 단백질을 만듭니다.")],
      [N("유전체·유전체학·단백질체학 (7~8p)","유전체(Genome) / 유전체학(Genomics) / 단백질체학(Proteomics)","컴퓨터 도구로 방대한 생물 데이터를 분석하는 학문은 생물정보학(Bioinformatics)입니다."), R("• 유전체(게놈): 한 생물체가 다음 세대로 물려주는 유전 정보의 총합.<br>• 유전체학: 한 종이나 여러 종의 전체 유전자 세트를 연구하는 학문.<br>• 단백질체학: 세포에서 발현되는 전체 단백질 세트(단백질체, proteome)와 그 기능을 연구하는 학문.","유전체학과 단백질체학의 역할","환원주의(쪼개서 연구)와 시스템 생물학(전체 네트워크 통합 이해)을 결합해 연구합니다.")],
      [N("화합물 & 4대 화학 결합 (21~27p)","화합물(Compound) / 공유·이온·수소·반데르발스 결합","강한 공유결합은 분자 골격을 만들고, 약한 결합들은 가역적 부착과 3차원 구조를 유지합니다."), R("• 화합물: 2개 이상의 서로 다른 원소가 일정 비율로 결합한 물질로 창발적 특성을 가짐(예: NaCl).<br>• ①공유결합: 원자가 전자 공유(가장 강함, 전기음성도 같으면 비극성 H₂·CH₄, 다르면 극성 H₂O).<br>• ②이온결합: 양이온(Na⁺)과 음이온(Cl⁻) 간의 정전기적 인력(건조 시 강함, 물속에선 약해짐).<br>• ③수소결합: δ+ 수소와 δ- 산소(O)·질소(N) 사이의 비공유 인력.<br>• ④반데르발스 인력: 전자의 순간적 쏠림에 의한 약한 인력(도마뱀붙이 발바닥).","화합물과 4가지 화학 결합의 역할","수용액 속의 이온결합, 수소결합, 반데르발스 인력은 대표적인 약한 화학 결합입니다.")],
      [N("7대 화학기 (37p 그림 2.26)","수산기·카르보닐기·카르복실기·아미노기·황화수소기·인산기·메틸기","앞의 6개는 화학반응에 참여하는 작용기이고, 메틸기는 비극성 DNA 인식 꼬리표입니다."), R("①수산기(-OH: 알코올, 친수성) ②카르보닐기(&gt;C=O: 골격 내부면 케톤[아세톤·과당], 끝이면 알데하이드[포도당]) ③카르복실기(-COOH: H⁺ 내놓는 유기산) ④아미노기(-NH₂: H⁺ 받는 염기) ⑤황화수소기(-SH: 티올, 시스테인 이황화 결합 형성) ⑥인산기(-OPO₃²⁻: 유기인산, ATP 에너지 공급) ⑦메틸기(-CH₃: 비극성, 5-메틸시토신 DNA 표지).","7가지 화학기의 역할","여성호르몬(에스트라디올)과 남성호르몬(테스토스테론)도 스테로이드에 붙은 화학기 차이로 구분됩니다.")],
      [N("탈수반응 vs 가수분해 (38~44p)","탄글(글리코시드) · 지에(에스터) · 단펩(펩타이드) / 인지질 · 스테로이드","모두 물(H2O)이 빠지는 탈수반응이지만 거대분자마다 결합 명칭이 다릅니다."), R("• 탈수반응: 물 분자(H₂O)가 제거되며 단위체를 연결해 중합체 합성(당=글리코시드 결합, 지방=에스터 결합, 단백질=펩타이드 결합) ↔ 가수분해: 물(H₂O)을 첨가해 결합을 끊어 분해.<br>• 인지질: 글리세롤+2 지방산(소수성 꼬리)+인산기(친수성 머리)로 세포막 이중층 형성.<br>• 스테로이드: 4개의 연결된 고리 구조를 가진 지질(예: 콜레스테롤 - 세포막 구성 및 성호르몬 전구체).","탈수·가수분해 및 지질의 역할","지방(트리아실글리세롤) 1g은 다당류 1g보다 2배 이상의 에너지를 저장합니다.")]
    ]
  },
  {
    p:"45~53p", tag:"주관식 1순위!", tit:"2. 단백질의 8가지 주요 기능(효방저수 호수수구) · 아미노산 기본구조 · 1~4차 구조 · 뉴클레오타이드",
    svg:'<svg width="100%" height="68" viewBox="0 0 440 68"><rect x="10" y="8" width="195" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="107" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">아미노산 기본구조 (47p)</text><text x="107" y="46" text-anchor="middle" font-size="11" font-weight="bold">아미노기(-NH₂) — α탄소(H, R기) — 카르복실기(-COOH)</text><rect x="220" y="8" width="210" height="52" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="325" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">뉴클레오타이드 (53p 그림 2.45)</text><text x="325" y="46" text-anchor="middle" font-size="11" font-weight="bold">인산기(5\'C) + 5탄당 + 염기(1\'C) [인산 빼면 뉴클레오사이드]</text></svg>',
    rows:[

      '<div style="margin:12px 0;"><input class="inp" id="termInp" style="width:220px;" placeholder="정답 용어 입력"> <button type="button" class="b-btn on" id="chkTerm">정답 확인</button></div><div id="qOut" style="font-size:0.88rem;"></div>';

  } else if(curQ.type==="essay") {
    b.innerHTML = '<span class="bdg hot">🖋️ 주관식 서술형 (10문제 중 7문제 선택 대비)</span><div class="c-title">'+curQ.tit+'</div><textarea id="qTxt" style="width:100%; height:90px; padding:8px; margin:8px 0; border:1px solid #cbd5e1; border-radius:8px;" placeholder="핵심 키워드와 역할을 포함해 서술해 보세요!"></textarea><button type="button" class="b-btn on" id="chkEssay">필수 키워드 채점 & 모범답안</button><div id="qOut" style="margin-top:10px; font-size:0.88rem; white-space:pre-line;"></div>';

document.addEventListener("click", function(e){

    document.getElementById("dRole").innerText = "🎯 핵심 역할·기능: " + item.getAttribute("data-r");
    document.getElementById("dWhy").innerText = "💡 왜 그럴까요?: " + item.getAttribute("data-w");
    document.getElementById("dock").classList.add("on");
    return;
  }
  if(e.target.id==="dClose") { document.getElementById("dock").classList.remove("on"); return; }

  var tabBtn = e.target.closest("[data-tab]");
  if(tabBtn) {
    document.querySelectorAll(".sec").forEach(function(s){ s.classList.remove("on"); });
    document.getElementById(tabBtn.getAttribute("data-tab")).classList.add("on");
    document.querySelectorAll(".nav-b").forEach(function(b){ b.classList.remove("on"); });
    tabBtn.classList.add("on");
    return;
  }

  if(e.target.id==="bName") { document.body.classList.toggle("hide-n"); e.target.classList.toggle("on"); document.querySelectorAll(".t-n").forEach(function(x){x.classList.remove("show");}); }
  if(e.target.id==="bRole") { document.body.classList.toggle("hide-r"); e.target.classList.toggle("on"); document.querySelectorAll(".t-r").forEach(function(x){x.classList.remove("show");}); }
  if(e.target.id==="bShow") { document.body.classList.remove("hide-n","hide-r"); document.getElementById("bName").classList.remove("on"); document.getElementById("bRole").classList.remove("on"); }

  var aaf = e.target.closest("[data-aaf]");
  if(aaf) { curAAF = aaf.getAttribute("data-aaf"); aaf.parentElement.querySelectorAll(".b-btn").forEach(function(b){b.classList.remove("on");}); aaf.classList.add("on"); renderAA(); }
  var aam = e.target.closest("[data-aam]");
  if(aam) { document.getElementById("aaBox").classList.toggle(aam.getAttribute("data-aam")); aam.classList.toggle("on"); }

  var qt = e.target.closest("[data-qt]");
  if(qt) { curQT = qt.getAttribute("data-qt"); qt.parentElement.querySelectorAll(".b-btn").forEach(function(b){b.classList.remove("on");}); qt.classList.add("on"); loadQuiz(); }
  if(e.target.id==="nextQBtn") loadQuiz();

  if(e.target.id==="chkTerm") {
    var u = document.getElementById("termInp").value.trim().toLowerCase();
    var ok = curQ.ans.some(function(a){ return a.toLowerCase()===u; });
    document.getElementById("qOut").innerHTML = "<b>"+(ok?"⭕ 정답입니다!":"❌ 정답 확인:")+" ["+curQ.ans[0]+"]</b><br>"+curQ.exp;
  }
  if(e.target.id==="chkBlank") {
    var hit=0;
    curQ.ans.forEach(function(a,i){ var el=document.getElementById("qi-"+i); if(el && el.value.trim()===a){el.style.background="#dcfce7"; hit++;} else if(el){el.style.background="#fee2e2";} });
    document.getElementById("qOut").innerHTML = "<b>🎯 채점: "+curQ.ans.length+"개 중 "+hit+"개 정답!</b><br>정답: "+curQ.ans.join(", ")+"<br>"+curQ.exp;
  }
  if(e.target.id==="chkEssay") {
    var v = document.getElementById("qTxt").value, hit=0;
    var tags = curQ.kw.map(function(k){ var ok=v.indexOf(k)!==-1; if(ok)hit++; return '<span style="display:inline-block; padding:2px 6px; margin:2px; border-radius:4px; font-weight:700; background:'+(ok?'#dcfce7':'#fee2e2')+';">'+(ok?'✔ ':'✘ ')+k+'</span>'; }).join('');
    document.getElementById("qOut").innerHTML = "<b>📊 필수 키워드 포함: "+curQ.kw.length+"개 중 "+hit+"개</b><div style='margin:6px 0;'>"+tags+"</div><b>📖 만점 모범답안:</b>\n"+curQ.mod;
  }
  var qOpt = e.target.closest(".q-opt");
  if(qOpt) {
    var idx = parseInt(qOpt.getAttribute("data-qi"),10);
    document.querySelectorAll(".q-opt").forEach(function(b,i){ if(i===curQ.ans) b.classList.add("ok"); else if(i===idx) b.classList.add("no"); });
    document.getElementById("qOut").innerHTML = "<b>"+(idx===curQ.ans?"⭕ 정답입니다!":"❌ 오답입니다!")+"</b><br>"+curQ.exp;
  }
});
</script>
</body>
</html>
