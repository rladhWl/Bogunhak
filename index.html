<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공중보건학 암기 어플</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .sub {
      margin-bottom: 20px;
      color: #6b7280;
    }
    .panel {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    .controls > div {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 14px;
      font-weight: 700;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e5e7eb; color: #111827; }
    .good { background: #16a34a; color: white; }
    .bad { background: #dc2626; color: white; }
    .warn { background: #f59e0b; color: white; }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: #dbeafe;
      color: #1d4ed8;
    }
    .q {
      font-size: 22px;
      line-height: 1.6;
      font-weight: 800;
      margin: 12px 0 16px;
    }
    .answer {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      white-space: pre-line;
      line-height: 1.7;
      display: none;
    }
    .choices {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }
    .choice-btn {
      width: 100%;
      text-align: left;
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    .choice-btn.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }
    .choice-btn.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    .stat .num {
      font-size: 28px;
      font-weight: 800;
      color: #2563eb;
    }
    .muted { color: #6b7280; }
    .small { font-size: 13px; }
    @media (max-width: 800px) {
      .controls, .stats {
        grid-template-columns: 1fr 1fr;
      }
      .q { font-size: 19px; }
    }
    @media (max-width: 520px) {
      .controls, .stats {
        grid-template-columns: 1fr;
      }
      button { width: 100%; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>공중보건학 암기 어플</h1>
    <div class="sub">서술형 · 4지선다 · OX로 1강 / 11강 / 12강 필수 암기 문제를 연습할 수 있어.</div>

    <div class="panel">
      <div class="controls">
        <div>
          <label for="mode">학습 모드</label>
          <select id="mode">
            <option value="short">서술형</option>
            <option value="mcq">객관식 4지선다</option>
            <option value="ox">OX</option>
          </select>
        </div>
        <div>
          <label for="part">파트 선택</label>
          <select id="part">
            <option value="all">전체</option>
            <option value="1강">1강</option>
            <option value="11강">11강</option>
            <option value="12강">12강</option>
          </select>
        </div>
        <div>
          <label for="filter">문제 필터</label>
          <select id="filter">
            <option value="all">전체 문제</option>
            <option value="wrong">어려움 표시 문제만</option>
            <option value="unseen">아직 안 본 문제만</option>
          </select>
        </div>
        <div>
          <label for="search">검색</label>
          <input type="text" id="search" placeholder="예: 보건소, 질병의 자연사" />
        </div>
      </div>

      <div class="btn-row">
        <button class="primary" id="newBtn">새 문제</button>
        <button class="secondary" id="showAnswerBtn">정답 보기</button>
        <button class="good" id="markKnownBtn">외웠음</button>
        <button class="warn" id="markHardBtn">어려움</button>
        <button class="secondary" id="resetBtn">기록 초기화</button>
      </div>
    </div>

    <div class="panel">
      <div class="card-title">
        <div>
          <span class="badge" id="partBadge">파트</span>
          <span class="badge" id="modeBadge">모드</span>
        </div>
        <div class="muted small" id="progressText">문제를 불러오는 중...</div>
      </div>

      <div class="q" id="questionBox">문제가 여기에 표시됩니다.</div>
      <div class="choices" id="choicesBox"></div>
      <div class="answer" id="answerBox"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="num" id="totalStat">0</div>
        <div>전체 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="seenStat">0</div>
        <div>학습한 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="hardStat">0</div>
        <div>어려운 문제</div>
      </div>
      <div class="stat">
        <div class="num" id="accStat">0%</div>
        <div>객관식/OX 정답률</div>
      </div>
    </div>
  </div>

  <script>

    let currentQuestion = null;
    let currentPool = [];
    let stats = JSON.parse(localStorage.getItem("ph_stats") || "{}");

    function ensureStats() {
      data.forEach(q => {
        if (!stats[q.id]) {
          stats[q.id] = {
            seen: false,
            hard: false,
            known: false,
            correct: 0,
            wrong: 0
          };
        }
      });
      saveStats();
    }

    function saveStats() {
      localStorage.setItem("ph_stats", JSON.stringify(stats));
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sample(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function filteredData() {
      const mode = document.getElementById("mode").value;
      const part = document.getElementById("part").value;
      const filter = document.getElementById("filter").value;
      const search = document.getElementById("search").value.trim();

      let list = data.filter(q => {
        if (part !== "all" && q.part !== part) return false;
        if (search && !(q.question.includes(search) || q.answer.includes(search))) return false;
        if (filter === "wrong" && !stats[q.id].hard) return false;
        if (filter === "unseen" && stats[q.id].seen) return false;
        return true;
      });

      if (mode === "mcq" || mode === "ox") {
        list = list.filter(q => q.answer && q.answer.length > 0);
      }

      return list;
    }

    function updateStatsView() {
      const total = data.length;
      const seen = data.filter(q => stats[q.id].seen).length;
      const hard = data.filter(q => stats[q.id].hard).length;

      let totalRight = 0, totalAttempt = 0;
      data.forEach(q => {
        totalRight += stats[q.id].correct;
        totalAttempt += stats[q.id].correct + stats[q.id].wrong;
      });
      const acc = totalAttempt ? Math.round((totalRight / totalAttempt) * 100) : 0;

      document.getElementById("totalStat").textContent = total;
      document.getElementById("seenStat").textContent = seen;
      document.getElementById("hardStat").textContent = hard;
      document.getElementById("accStat").textContent = acc + "%";
    }

    function renderQuestion() {
      currentPool = filteredData();
      const qBox = document.getElementById("questionBox");
      const aBox = document.getElementById("answerBox");
      const cBox = document.getElementById("choicesBox");
      const progress = document.getElementById("progressText");
      const mode = document.getElementById("mode").value;

      aBox.style.display = "none";
      aBox.textContent = "";
      cBox.innerHTML = "";

      if (currentPool.length === 0) {
        currentQuestion = null;
        qBox.textContent = "조건에 맞는 문제가 없어.";
        progress.textContent = "0개 문제";
        document.getElementById("partBadge").textContent = "문제 없음";
        document.getElementById("modeBadge").textContent = modeLabel(mode);
        updateStatsView();
        return;
      }

      currentQuestion = sample(currentPool);
      stats[currentQuestion.id].seen = true;
      saveStats();

      qBox.textContent = currentQuestion.question;
      aBox.textContent = currentQuestion.answer;
      document.getElementById("partBadge").textContent = currentQuestion.part;
      document.getElementById("modeBadge").textContent = modeLabel(mode);
      progress.textContent = `현재 조건 문제 수: ${currentPool.length}개`;

      if (mode === "mcq") renderMCQ(currentQuestion);
      if (mode === "ox") renderOX(currentQuestion);

      updateStatsView();
    }

    function modeLabel(mode) {
      if (mode === "short") return "서술형";
      if (mode === "mcq") return "객관식 4지선다";
      if (mode === "ox") return "OX";
      return mode;
    }

    function renderMCQ(q) {
      const cBox = document.getElementById("choicesBox");
      const wrongAnswers = shuffle(
        data.filter(x => x.id !== q.id && x.part === q.part).map(x => x.answer)
      ).slice(0, 3);

      while (wrongAnswers.length < 3) {
        const extra = sample(data.filter(x => x.id !== q.id)).answer;
        if (!wrongAnswers.includes(extra) && extra !== q.answer) wrongAnswers.push(extra);
      }

      const choices = shuffle([q.answer, ...wrongAnswers]);

      choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `${idx + 1}. ${choice}`;
        btn.onclick = () => {
          const all = [...document.querySelectorAll(".choice-btn")];
          all.forEach(b => b.disabled = true);
          if (choice === q.answer) {
            btn.classList.add("correct");
            stats[q.id].correct += 1;
          } else {
            btn.classList.add("wrong");
            all.forEach(b => {
              if (b.textContent.slice(3) === q.answer) b.classList.add("correct");
            });
            stats[q.id].wrong += 1;
          }
          saveStats();
          document.getElementById("answerBox").style.display = "block";
          updateStatsView();
        };
        cBox.appendChild(btn);
      });
    }

    function renderOX(q) {
      const cBox = document.getElementById("choicesBox");
      const isTrue = Math.random() < 0.5;
      let shown = q.answer;

      if (!isTrue) {
        const candidates = data.filter(x => x.id !== q.id && x.part === q.part);
        shown = sample(candidates).answer;
      }

      const stmt = document.createElement("div");
      stmt.style.padding = "12px";
      stmt.style.background = "#f9fafb";
      stmt.style.border = "1px solid #e5e7eb";
      stmt.style.borderRadius = "12px";
      stmt.style.lineHeight = "1.7";
      stmt.innerHTML = `<strong>판단 문장:</strong><br>${shown}`;
      cBox.appendChild(stmt);

      ["O", "X"].forEach(mark => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = mark;
        btn.onclick = () => {
          const correct = (mark === "O" && isTrue) || (mark === "X" && !isTrue);
          const all = [...document.querySelectorAll(".choice-btn")];
          all.forEach(b => b.disabled = true);
          if (correct) {
            btn.classList.add("correct");
            stats[q.id].correct += 1;
          } else {
            btn.classList.add("wrong");
            stats[q.id].wrong += 1;
          }
          saveStats();
          document.getElementById("answerBox").style.display = "block";
          document.getElementById("answerBox").textContent =
            `정답: ${isTrue ? "O" : "X"}\n\n원래 정답:\n${q.answer}`;
          updateStatsView();
        };
        cBox.appendChild(btn);
      });
    }

    function showAnswer() {
      if (!currentQuestion) return;
      const aBox = document.getElementById("answerBox");
      aBox.style.display = "block";
      aBox.textContent = currentQuestion.answer;
    }

    function markKnown() {
      if (!currentQuestion) return;
      stats[currentQuestion.id].known = true;
      stats[currentQuestion.id].hard = false;
      saveStats();
      updateStatsView();
      alert("외웠음으로 표시했어.");
    }

    function markHard() {
      if (!currentQuestion) return;
      stats[currentQuestion.id].hard = true;
      saveStats();
      updateStatsView();
      alert("어려움 문제로 표시했어.");
    }

    function resetAll() {
      if (!confirm("학습 기록을 모두 초기화할까?")) return;
      stats = {};
      ensureStats();
      renderQuestion();
      updateStatsView();
    }

    document.getElementById("newBtn").addEventListener("click", renderQuestion);
    document.getElementById("showAnswerBtn").addEventListener("click", showAnswer);
    document.getElementById("markKnownBtn").addEventListener("click", markKnown);
    document.getElementById("markHardBtn").addEventListener("click", markHard);
    document.getElementById("resetBtn").addEventListener("click", resetAll);

    document.getElementById("mode").addEventListener("change", renderQuestion);
    document.getElementById("part").addEventListener("change", renderQuestion);
    document.getElementById("filter").addEventListener("change", renderQuestion);
    document.getElementById("search").addEventListener("input", renderQuestion);

    ensureStats();
    updateStatsView();
    renderQuestion();
  </script>
